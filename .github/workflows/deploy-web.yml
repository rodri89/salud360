# Publica la web (Kotlin/Wasm) en el hosting cada vez que se hace push a main.
#
# El hosting compartido no puede compilar Kotlin, así que el build se hace acá y solo se suben los archivos
# estáticos resultantes por rsync sobre SSH (el acceso SSH del plan de Hostinger). Secrets necesarios en GitHub
# (Settings → Secrets and variables → Actions):
#   HOSTINGER_SSH_HOST      IP o host SSH que muestra hPanel (ej. 195.179.239.54)
#   HOSTINGER_SSH_PORT      puerto SSH (Hostinger usa 65002)
#   HOSTINGER_SSH_USER      usuario del hosting (ej. u895805914)
#   HOSTINGER_SSH_PASSWORD  su contraseña
#   HOSTINGER_WEB_DIR       carpeta del subdominio, relativa al home (ej. domains/salud360.turnosonlinebb.com/public_html)
name: Web → Hostinger

on:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "core/**"
      - "features/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Si llegan dos pushes seguidos, se cancela el deploy anterior y se publica solo el último.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Compilar y subir
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # Los módulos compartidos tienen target Android: la configuración de Gradle necesita el SDK aunque solo
      # se compile la web. El runner ya lo trae; se aceptan las licencias para que AGP pueda bajar lo que falte.
      - name: Licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Compilar la web (wasmJs, producción)
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon --console=plain

      - name: Quitar mapas de depuración
        run: rm -f composeApp/build/dist/wasmJs/productionExecutable/*.map

      - name: Subir al hosting por rsync (SSH)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          # sshpass -e toma la contraseña de la variable SSHPASS (nunca aparece en el log).
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          WEB_DIR: ${{ secrets.HOSTINGER_WEB_DIR }}
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_PORT SSH_USER SSHPASS WEB_DIR; do
            if [ -z "${!v}" ]; then echo "Falta cargar el secret para $v (ver comentario al inicio del workflow)"; exit 1; fi
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync > /dev/null
          SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # Crea la carpeta si no existe y sincroniza: sube lo que cambió y borra lo que ya no está (los .wasm viejos).
          sshpass -e $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$WEB_DIR'"
          sshpass -e rsync -az --delete --exclude '*.map' -e "$SSH" \
            composeApp/build/dist/wasmJs/productionExecutable/ "$SSH_USER@$SSH_HOST:$WEB_DIR/"
          echo "Publicado en $WEB_DIR"

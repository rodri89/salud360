org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ---- Entornos de Salud 360 (ver docs/DESPLIEGUE.md) ----
# La app compila contra "dev" (MAMP local) o "release" (producción). Se elige con -Pentorno=dev|release;
# sin la propiedad, es dev cuando se corren tareas de desarrollo (wasmJsBrowserDevelopmentRun, assembleDebug,
# installDebug, devWeb, devAndroid) y release en las demás. `{host}` se reemplaza en cada plataforma:
# localhost en web e iOS simulador, 10.0.2.2 en el emulador Android, o el valor de -PdevHost=192.168.x.x
# para probar en un teléfono físico contra la Mac.
salud360.entorno.dev.turnos=http://{host}:8888/TurnosOnlineBB/TurnosImage/public/index.php
salud360.entorno.dev.hc.pediatria=http://{host}:8888/HCPediatria/public_html/pediatria/HCDPediatria/public/index.php
salud360.entorno.release.turnos=https://turnosonlinebb.com
salud360.entorno.release.hc.pediatria=https://pediatria.hclinicadigital.com
